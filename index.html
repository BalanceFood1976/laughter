<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>심리 자가진단 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      padding: 30px 20px;
      max-width: 640px;
      margin: 0 auto;
      text-align: left;
    }
    h2, p, label, button {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }
    h2 { font-size: 24px; margin-bottom: 10px; animation-delay: 0.2s; }
    p { margin-bottom: 20px; font-size: 16px; animation-delay: 0.4s; }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
    }
    input[type="checkbox"] { margin-right: 8px; }
    button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      animation-delay: 1.4s;
    }
    button:hover { background-color: #388e3c; }
    button:active { box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    label:nth-of-type(n) { animation-delay: calc(0.5s + 0.1s * var(--i)); }
  </style>
</head>
<body>
  <h2>자가 진단 테스트</h2>
  <p>아래 항목 중 몇 개나 해당되시나요?</p>
  <form id="testForm">
    <label style="--i:1"><input type="checkbox"/> 하루에 3시간 이상 뉴스를 본다</label>
    <label style="--i:2"><input type="checkbox"/> 뉴스 보고 나면 기분이 나빠진다</label>
    <label style="--i:3"><input type="checkbox"/> 재미없는 콘텐츠도 의무감으로 본다</label>
    <label style="--i:4"><input type="checkbox"/> 요즘 ‘하하’ 소리 내 웃은 적이 없다</label>
    <label style="--i:5"><input type="checkbox"/> SNS보다 밈이나 짤방이 더 반갑다</label>
    <label style="--i:6"><input type="checkbox"/> 아무 정보도 보고 싶지 않은 날이 자주 있다</label>
    <label style="--i:7"><input type="checkbox"/> 친구에게 “나 요즘 진짜 피곤해”를 자주 말한다</label>
    <label style="--i:8"><input type="checkbox"/> 허무함이 느껴질 때가 있다</label>
    <label style="--i:9"><input type="checkbox"/> 불면이 잦다</label>
    <label style="--i:10"><input type="checkbox"/> 가벼운 농담도 예민하게 받아들인다</label>
    <p>0~2개: 안정 / 3~5개: 주의 / 6~7개: 위험 / 8개 이상: 고위험</p>
    <button onclick="checkResult()" type="button">결과 확인하기</button>
  </form>
  <script>
    function checkResult() {
      const boxes = document.querySelectorAll('input[type="checkbox"]');
      let count = 0;
      boxes.forEach(box => { if (box.checked) count++; });

      let page = '';
      if (count <= 2) page = 'result-low.html';
      else if (count <= 5) page = 'result-mid.html';
      else if (count <= 7) page = 'result-high.html';
      else page = 'result-veryhigh.html';

      window.location.href = page;
    }
  </script>
</body>
</html>
